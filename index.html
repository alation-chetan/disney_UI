<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Enterprise Data Marketplace — UI Prototype</title>
<style>
:root{
  /* deep, restrained navy chrome */
  --navy:#0E1F33;
  --navy-dark:#0A1728;
  --navy-darker:#08121F;
  /* signature warm accent — used sparingly for the "push up" action */
  --orange:#DE8138;
  /* confident primary accent */
  --blue:#2563EB;
  --blue-dark:#1E40AF;
  --pill-bg:#EEF3FE;
  --ink:#0B1524;
  --ink-2:#3B4859;
  --muted:#6A7787;
  --line:#E7EBF1;
  --line-soft:#F1F4F9;
  --card:#ffffff;
  --canvas:#F5F7FA;      /* light content canvas so white cards float */
  --bg:#0B1728;
  --green-bg:#E6F5EC;--green:#1E8E5A;
  --segA:#6D5AE6;--segA-bg:#EEEBFC;
  --segB:#0E9488;--segB-bg:#DCF2EF;
  --edm:#2563EB;--edm-bg:#EAF1FE;
  --radius:14px;
  --shadow:0 1px 2px rgba(11,21,36,.05),0 4px 14px rgba(11,21,36,.05);
  --shadow-hover:0 12px 34px rgba(11,21,36,.13);
  --font:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --serif:"Georgia","Times New Roman",Cambria,serif;   /* editorial display face */
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden;letter-spacing:-0.006em}
button{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(11,21,36,.16);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:rgba(11,21,36,.28)}
::-webkit-scrollbar-track{background:transparent}
.ico{display:inline-block;vertical-align:-.16em;flex:0 0 auto}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:92px 1fr;grid-template-rows:58px 1fr;height:100vh}
.app.nav-open{grid-template-columns:92px 240px 1fr}
.topbar{grid-column:1 / -1;background:var(--navy);display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 22px;color:#fff;position:relative;z-index:5;border-bottom:1px solid rgba(255,255,255,.06)}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand .glyph{width:28px;height:28px;border-radius:8px;background:linear-gradient(140deg,#2f6bf0,#1b45b8);display:grid;place-items:center;color:#fff;font-size:15px;flex:0 0 auto;box-shadow:0 2px 6px rgba(37,99,235,.4)}
.brand .crumb{display:flex;align-items:center;gap:9px;font-size:13.5px;color:#cdd8e6;font-weight:500;min-width:0}
.brand .crumb b{color:#fff;font-weight:650}
.brand .crumb .sep{color:rgba(255,255,255,.32)}
.topbar-right{display:flex;align-items:center;gap:12px}
.icon-btn{width:32px;height:32px;border-radius:9px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.04);color:#dbe6f2;display:grid;place-items:center;font-size:14px;transition:.15s}
.icon-btn:hover{background:rgba(255,255,255,.12);color:#fff}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(140deg,#3b82f6,#1d4ed8);color:#fff;display:grid;place-items:center;font-weight:600;font-size:12.5px;box-shadow:0 2px 6px rgba(29,78,216,.4)}

/* ---------- Icon rail (marketplace switcher) ---------- */
.rail{background:var(--navy-darker);display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:16px 8px}
.rail-store{width:38px;height:38px;border:0;border-radius:10px;background:linear-gradient(140deg,#2f6bf0,#1b45b8);display:grid;place-items:center;color:#fff;margin:0 auto 6px;box-shadow:0 3px 10px rgba(37,99,235,.4);cursor:pointer;transition:.15s}
.rail-store:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(37,99,235,.5)}
.rail-div{width:32px;height:1px;background:rgba(255,255,255,.12);margin:0 auto 8px}
.rail-item{width:100%;display:flex;flex-direction:column;align-items:center;gap:6px;padding:9px 3px;border-radius:12px;background:transparent;border:0;position:relative;cursor:pointer;transition:.16s}
.rail-item .rtile{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:14px;font-weight:700;color:#fff;background:rgba(255,255,255,.09);letter-spacing:.01em;transition:.16s}
.rail-item .rlabel{font-size:9.5px;font-weight:600;color:#8598ae;text-align:center;line-height:1.15;letter-spacing:.01em}
.rail-item:hover{background:rgba(255,255,255,.05)}
.rail-item:hover .rtile{background:rgba(255,255,255,.16)}
.rail-item:hover .rlabel{color:#cfdae7}
.rail-item.active{background:rgba(255,255,255,.06)}
.rail-item.active .rtile{box-shadow:0 5px 16px rgba(0,0,0,.32)}
.rail-item.active .rlabel{color:#fff}
.rail-item.active::before{content:"";position:absolute;left:-8px;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:#fff}

/* ---------- Nav panel (per-section menu) ---------- */
.navpanel{background:var(--navy);color:#c3d0e0;padding:20px 16px 18px;overflow-y:auto;display:none;flex-direction:column}
.app.nav-open .navpanel{display:flex}
.np-head{padding:2px 8px 16px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:14px}
.np-name{font-size:15px;font-weight:650;color:#fff;line-height:1.3;letter-spacing:-.01em}
.np-scope{display:inline-block;margin-top:8px;font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;letter-spacing:.04em;text-transform:uppercase}
.np-label{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:#6a819b;margin:2px 8px 10px;font-weight:600}
.np-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:0;color:#c3d0e0;padding:11px 12px;border-radius:10px;font-size:13.5px;font-weight:550;position:relative;margin-bottom:3px;transition:.14s}
.np-item .ic{font-size:15px;width:20px;text-align:center;flex:0 0 auto;opacity:.9}
.np-item .cnt{margin-left:auto;font-size:11px;font-weight:600;color:#c3d0e0;background:rgba(255,255,255,.12);padding:1px 8px;border-radius:20px}
.np-item:hover{background:rgba(255,255,255,.06);color:#fff}
.np-item.active{background:rgba(255,255,255,.11);color:#fff}
.np-item.active .ic{opacity:1}
.np-item.active::before{content:"";position:absolute;left:-16px;top:9px;bottom:9px;width:3px;background:var(--blue);border-radius:0 3px 3px 0}
.rollup-note{font-size:11.5px;color:#6a819b;padding:16px 10px 0;line-height:1.55;margin-top:auto;border-top:1px solid rgba(255,255,255,.06)}

/* ---------- Main / content card ---------- */
.main{padding:0;overflow:hidden;display:flex}
.card-surface{background:var(--canvas);margin:0;flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.content{flex:1;overflow-y:auto;padding:0 40px 72px}
.content>*{max-width:1180px;margin-left:auto;margin-right:auto}
.page-title{font-family:var(--serif);font-size:28px;font-weight:700;margin:0;color:var(--ink);letter-spacing:-.01em}
.page-sub{color:var(--muted);font-size:14px;margin:6px 0 0}
.page-head{padding:30px 0 8px}
/* content-level tabs (Home / Browse / Bookmarks) on The Marketplace page */
.mkt-tabs{display:flex;gap:30px;border-bottom:1px solid var(--line);margin:26px 0 4px;padding:0}
.mkt-tab{background:none;border:0;padding:4px 2px 14px;font-size:15px;font-weight:600;color:var(--muted);position:relative;top:1px}
.mkt-tab.active{color:var(--ink)}
.mkt-tab.active::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2.5px;background:var(--blue);border-radius:3px}
.mkt-tab:hover{color:var(--ink)}

/* ---------- Manage page ---------- */
.mgr-head{padding:24px 0 0}
.mgr-tabs{display:flex;gap:8px;margin-top:16px;border-bottom:1px solid var(--line);padding-bottom:0}
.mgr-tab{background:transparent;border:0;border-bottom:2.5px solid transparent;padding:8px 4px 12px;margin-right:18px;font-size:14px;font-weight:600;color:var(--muted)}
.mgr-tab.active{color:var(--ink);border-bottom-color:var(--blue)}
.mgr-tab:hover{color:var(--ink)}
.mgr-split{display:grid;grid-template-columns:minmax(340px,400px) 1fr;gap:26px;margin-top:24px;align-items:start}
.mgr-controls{max-height:calc(100vh - 220px);overflow-y:auto;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px 20px 0}
.mgr-preview{position:sticky;top:12px}
.mgr-pv-label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
.mgr-pv-frame{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;box-shadow:var(--shadow-hover);max-height:calc(100vh - 240px);overflow-y:auto}
.mgr-pv-inner{zoom:.58;pointer-events:none;padding:0 20px 24px;background:var(--canvas)}
.mgr-controls .cz-foot{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);margin:8px -20px 0;padding:14px 20px}
/* curation list */
.cur-note{background:#FFF7F0;border:1px solid #F7D9C2;color:#8a4b1f;border-radius:10px;padding:12px 16px;font-size:12.5px;margin:20px 0 6px;display:flex;gap:10px;line-height:1.5}
.cur-list{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.cur-row{display:flex;align-items:center;gap:16px;border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);flex-wrap:wrap}
.cur-ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:19px;color:#fff;flex:0 0 auto}
.cur-main{min-width:180px;flex:1}
.cur-main h4{margin:0;font-size:14.5px;color:var(--ink)}
.cur-main .cm{font-size:12px;color:var(--muted);margin-top:2px}
.cur-doms{display:flex;flex-wrap:wrap;gap:6px;max-width:320px}
.cur-status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 11px;border-radius:20px}
.cur-status.in{color:var(--green);background:var(--green-bg)}
.cur-status.out{color:var(--muted);background:#eef1f5}
.cur-acts{display:flex;gap:10px;margin-left:auto}

/* ---------- Browse — AI insights hero (matches the Alation reference) ---------- */
.ai-hero{margin:34px 0 6px}
.ai-eyebrow{color:var(--muted);font-size:14.5px}
.ai-eyebrow a{color:var(--blue);text-decoration:none;font-weight:600}
.ai-eyebrow a:hover{text-decoration:underline}
.ai-h{font-family:var(--serif);font-size:30px;font-weight:700;margin:8px 0 22px;color:var(--ink);letter-spacing:-.012em}
.ai-box{display:flex;align-items:center;gap:12px;border:1.6px solid var(--blue);border-radius:14px;padding:16px 18px;background:#fff;box-shadow:0 0 0 3px rgba(37,99,235,.10)}
.ai-box input{flex:1;border:0;outline:0;font-size:15.5px;color:var(--ink);background:transparent}
.ai-box .send{width:34px;height:34px;border-radius:9px;border:0;background:var(--pill-bg);color:var(--blue);display:grid;place-items:center;flex:0 0 auto;transition:.15s}
.ai-box .send:hover{background:var(--blue);color:#fff}
.ai-disc{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12.5px;margin:12px 2px 0}
.ai-disc .ico{color:var(--orange)}
.browse-count{margin-left:auto;font-size:13px;color:var(--muted);font-weight:500}
.browse-tools{display:flex;align-items:center;gap:10px;margin:16px 0 4px}
.section-head{margin:34px 0 2px}
.section-head h3{font-size:20px;font-weight:700;margin:0;color:var(--ink)}
.section-head p{color:var(--muted);font-size:13.5px;margin:4px 0 0}
.control{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;font-size:13px;color:var(--ink-2);font-weight:550;box-shadow:var(--shadow)}
.control select{border:0;background:transparent;font:inherit;color:inherit;outline:0;cursor:pointer}
.search-inline{margin-left:auto;position:relative}
.search-inline input{border:1px solid var(--line);border-radius:10px;padding:10px 12px 10px 36px;font-size:13px;width:250px;outline:0;background:#fff;box-shadow:var(--shadow);transition:.15s}
.search-inline input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.search-inline .mag{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#9aa8b6;font-size:13px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;margin-top:20px}

/* ---------- Card ---------- */
.pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:box-shadow .18s,transform .18s,border-color .18s;position:relative}
.pcard:hover{box-shadow:var(--shadow-hover);transform:translateY(-3px);border-color:#d7deea}
.pcard .bm{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:8px;border:1px solid transparent;background:transparent;color:#b6c1cd;font-size:16px;display:grid;place-items:center;line-height:1}
.pcard .bm:hover{background:#f2f5f8;color:var(--ink)}
.pcard .bm.on{color:var(--blue)}
.pcard .bm.on svg{fill:currentColor}
.pcard .p-icon{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:#fff;margin-bottom:14px}
.p-source .p-src{display:inline-flex}
.pill.edm-pill .ico,.origin .ico,.pushed-tag .ico,.push-btn .ico{margin-right:1px}
.pcard h4{font-size:16px;font-weight:700;margin:0 40px 8px 0;color:var(--ink);line-height:1.25}
.p-owner{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:13px;margin-bottom:10px}
.p-owner .oav{width:20px;height:20px;border-radius:50%;background:#5a6b7b;color:#fff;font-size:9px;font-weight:600;display:grid;place-items:center}
.p-source{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2);font-weight:500;padding-bottom:10px;border-bottom:1px solid var(--line-soft);margin-bottom:10px}
.p-desc{color:var(--muted);font-size:13.5px;line-height:1.5;margin:0 0 14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.p-stats{display:flex;gap:16px;color:var(--muted);font-size:12.5px;margin-bottom:12px}
.p-stats span{display:inline-flex;align-items:center;gap:5px}
.p-pills{display:flex;flex-wrap:wrap;gap:7px;margin-top:auto}
.pill{background:var(--pill-bg);color:var(--blue-dark);font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;white-space:nowrap}
.pill.edm-pill{background:var(--edm-bg);color:#b0491a}
.origin{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;margin-bottom:12px}
.p-footer{margin-top:14px;padding-top:12px;border-top:1px solid var(--line-soft);display:flex;flex-direction:column;align-items:stretch;gap:9px}
.pushed-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.push-acts{display:flex;gap:16px;justify-content:flex-end}
.push-btn{border:1px solid var(--orange);color:var(--orange);background:#fff;font-weight:600;font-size:12.5px;padding:8px 12px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.push-btn:hover{background:var(--edm-bg)}
.pushed-tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--green);background:var(--green-bg);padding:5px 11px;border-radius:8px}
.link-btn{color:var(--blue);font-weight:600;font-size:12.5px;background:none;border:0;padding:2px 0}
.link-btn:hover{text-decoration:underline}
/* Push-to-EDM modal */
.modal-overlay{position:fixed;inset:0;background:rgba(13,19,34,.45);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;transition:.18s;z-index:70}
.modal-overlay.open{opacity:1}
.modal{background:#fff;width:480px;max-width:100%;max-height:90vh;border-radius:16px;box-shadow:0 24px 70px rgba(13,19,34,.35);display:flex;flex-direction:column;transform:translateY(8px);transition:.18s}
.modal-overlay.open .modal{transform:none}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 22px 14px}
.modal-kicker{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--orange)}
.modal-head h3{margin:4px 0 0;font-size:19px;color:var(--ink)}
.modal-body{padding:0 22px 4px;overflow-y:auto}
.mnote{background:var(--edm-bg);border:1px solid #CFE0FB;color:#1E40AF;border-radius:10px;padding:11px 14px;font-size:12.5px;line-height:1.5;margin-bottom:16px}
.mfield{margin-bottom:16px}
.mlbl{display:block;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
.mchips{display:flex;flex-wrap:wrap;gap:7px}
.dpick{display:flex;flex-direction:column;gap:8px}
.dpick-item{display:flex;align-items:center;gap:11px;border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:11px 13px;text-align:left;font:inherit}
.dpick-item:hover{border-color:var(--blue)}
.dpick-item.on{border-color:var(--blue);background:var(--edm-bg)}
.dpick-item .di{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-size:16px;color:#fff;flex:0 0 auto}
.dpick-item .dl{flex:1;font-size:14px;font-weight:600;color:var(--ink)}
.dpick-item .dck{width:20px;text-align:center;color:var(--blue);font-weight:800}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:16px 22px 20px}
.modal-foot .mcancel{border:1px solid var(--line);background:#fff;color:var(--ink-2);font-weight:600;font-size:13.5px;padding:10px 18px;border-radius:9px}
.modal-foot .mok{border:0;background:var(--orange);color:#fff;font-weight:600;font-size:13.5px;padding:10px 20px;border-radius:9px}
.modal-foot .mok:disabled{opacity:.5;cursor:not-allowed}
.cz-field select{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:13px;color:var(--ink);outline:0;background:#fff;font-family:inherit}
.cz-field select:focus{border-color:var(--blue)}
/* nav-row New button + primary button + My Data Products header */
.np-new{margin-left:auto;display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.25);font-weight:600;font-size:11px;padding:3px 9px;border-radius:7px}
.np-new:hover{background:var(--blue)}
.btn-primary{display:inline-flex;align-items:center;gap:7px;border:0;background:var(--blue);color:#fff;font-weight:600;font-size:13.5px;padding:11px 18px;border-radius:10px;box-shadow:0 4px 12px rgba(37,99,235,.28);transition:.15s}
.btn-primary:hover{background:var(--blue-dark)}
.mine-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* ---------- Empty state ---------- */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:90px 20px}
.empty .eicon{font-size:34px;color:#b6c1cd;margin-bottom:14px}
.empty h4{margin:0 0 6px;font-size:16px;color:var(--ink)}
.empty p{margin:0 0 22px;color:var(--muted);font-size:14px}
.btn-outline{border:1px solid var(--blue);color:var(--blue);background:#fff;font-weight:600;font-size:13.5px;padding:9px 18px;border-radius:9px}
.btn-outline:hover{background:#f0f7ff}

/* ---------- Home tab (wireframe-based) ---------- */
.home{margin-top:22px}
/* Hero band: logo + title over background image */
.hp-hero{position:relative;border-radius:18px;overflow:hidden;min-height:308px;display:flex;flex-direction:column;justify-content:flex-end;padding:26px 34px 34px;color:#fff;
  background:linear-gradient(135deg,#0c1f38 0%,#123a63 55%,#155a86 100%)}
.hp-hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(90% 120% at 88% 8%,rgba(80,150,230,.34),transparent 60%),
  radial-gradient(70% 90% at 6% 96%,rgba(37,99,235,.24),transparent 62%)}
/* larger dedicated logo area (top-left) */
.hp-logo{position:absolute;top:24px;left:30px;display:flex;align-items:center;gap:14px;z-index:2;max-width:60%}
.hp-logo .lmark{width:58px;height:58px;border-radius:14px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);display:grid;place-items:center;font-size:30px;backdrop-filter:blur(2px);flex:0 0 auto}
.hp-logo .lt{font-size:19px;line-height:1.15;font-weight:800;letter-spacing:.01em}
.hp-logo .lt small{display:block;font-weight:500;font-size:13px;opacity:.82;letter-spacing:.02em}
/* frosted plate so an uploaded company logo (any color) stays legible & feels roomy */
.logo-plate{display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.95);border-radius:14px;padding:16px 22px;box-shadow:0 6px 20px rgba(0,0,0,.22);min-height:64px;min-width:140px}
.logo-plate img{display:block}

/* downscale an uploaded image to a data URL so it fits in localStorage */
function fileToDataURL(file,maxW,maxH,cb){
  const r=new FileReader();
  r.onload=e=>{const img=new Image();img.onload=()=>{
    let w=img.width,h=img.height;const s=Math.min(1,maxW/w,maxH/h);
    w=Math.round(w*s);h=Math.round(h*s);
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;
    cv.getContext('2d').drawImage(img,0,0,w,h);
    const png=/png|gif|svg/i.test(file.type);
    cb(cv.toDataURL(png?'image/png':'image/jpeg',0.85));
  };img.src=e.target.result;};
  r.readAsDataURL(file);
}

/* --- small control builders --- */
function czField(label,key,{textarea,ph}={}){
  const wrap=el('div','cz-field');
  wrap.innerHTML=`<label>${label}</label>`;
  const inp=document.createElement(textarea?'textarea':'input');
  if(textarea) inp.rows=2;
  inp.value=czView()[key]||''; if(ph) inp.placeholder=ph;
  inp.oninput=()=>{ czSet(key,inp.value); czPreview(); };   // preview only → caret kept
  wrap.appendChild(inp); return wrap;
}
function czSelect(label,key,opts){
  const wrap=el('div','cz-field'); wrap.innerHTML=`<label>${label}</label>`;
  const s=document.createElement('select');
  opts.forEach(([v,t])=>{ const o=document.createElement('option'); o.value=v; o.textContent=t; s.appendChild(o); });
  s.value=String(czView()[key]);
  s.onchange=()=>{ const v=s.value; czSet(key, v==='all'?'all':(+v||v)); czPreview(); };
  wrap.appendChild(s); return wrap;
}
function czNumber(label,key,ph){
  const wrap=el('div','cz-field'); wrap.innerHTML=`<label>${label}</label>`;
  const inp=document.createElement('input'); inp.type='number'; inp.min='1'; if(ph) inp.placeholder=ph;
  const v=czView()[key]; inp.value=(v==null||v==='')?'':v;
  inp.oninput=()=>{ const n=parseInt(inp.value,10); czSet(key,(inp.value===''||isNaN(n)||n<1)?null:n); czPreview(); };
  wrap.appendChild(inp); return wrap;
}
function czSectionHead(title,showKey){
  const row=el('div','cz-sechead');
  row.innerHTML=`<span class="cz-lbl" style="margin:0">${title}</span>`;
  if(showKey){
    const on=czView().show[showKey]!==false;
    const lab=el('label','sw');
    lab.innerHTML=`<input type="checkbox" ${on?'checked':''}/><span></span>`;
    lab.title='Show / hide this section';
    lab.querySelector('input').onchange=e=>{ czSetShow(showKey,e.target.checked); czPreview(); };
    row.appendChild(lab);
  }
  return row;
}

function productsFor(sec){
  if(sec==='edm') return state.products.filter(p=>p.edm);

function toast(msg){
  const t=document.getElementById('toast'); t.innerHTML=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2600);
}

/* ---- Icon rail: marketplace switcher ---- */
function renderRail(){
  const rail=document.getElementById('rail'); rail.innerHTML='';
  const store=el('button','rail-store',icon('grid',18,1.9)); store.title='Data Products App menu';
  store.onclick=()=>{ state.navOpen=!state.navOpen; render(); };
  rail.appendChild(store);
  rail.appendChild(el('div','rail-div'));
  const meta={edm:['landmark','EDM'],A:['box','Segment A'],B:['box','Segment B']};
  [SECTIONS.edm,SECTIONS.A,SECTIONS.B].forEach(sec=>{
    const [g,label]=meta[sec.id];
    const b=el('button','rail-item'+(state.section===sec.id?' active':''));
    b.title=sec.name;
    b.innerHTML=`<span class="rtile">${icon(g,19,1.7)}</span><span class="rlabel">${label}</span>`;
    if(state.section===sec.id) b.querySelector('.rtile').style.background=sec.color;
    b.onclick=()=>{ state.section=sec.id; state.filter='all'; state.q=''; render(); };
    rail.appendChild(b);
  });
}

/* ---- Nav panel: per-section Data Products App menu ---- */
function renderNavPanel(){
  const sec=SECTIONS[state.section];
  document.getElementById('npName').textContent=sec.name;
  const cr=document.getElementById('crumbName'); if(cr) cr.textContent=sec.name;
  const sc=document.getElementById('npScope');
  sc.textContent=sec.id==='edm'?'Top-level':sec.short; sc.style.color=sec.color; sc.style.background=sec.bg;
  const menu=document.getElementById('navMenu'); menu.innerHTML='';
  const isEDM=state.section==='edm';
  const bmCount=productsFor(state.section).filter(p=>p.bm).length;
  const items=[
    ['marketplace','store','The Marketplace',''],
    ['bookmarks','bookmark','My Bookmarks',bmCount||''],
    ['auth','key','Manage Authentication',''],
  ];
  // Data products are authored in a segment, not at the top-level EDM
  if(!isEDM) items.push(['myproducts','box','My Data Products','+new']);
  items.push(['manage','sliders','Manage','']);
  const isMkt=state.view==='marketplace';
  items.forEach(([v,ic,label,extra])=>{
    let active;
    if(v==='marketplace') active = isMkt && state.mktTab!=='bookmarks';
    else if(v==='bookmarks') active = isMkt && state.mktTab==='bookmarks';
    else active = state.view===v;
    const b=el('button','np-item'+(active?' active':''));
    const cntHTML = (extra && extra!=='+new') ? `<span class="cnt">${extra}</span>` : '';
    b.innerHTML=`<span class="ic">${icon(ic,17)}</span><span>${label}</span>${cntHTML}`;
    b.onclick=()=>{
      if(v==='marketplace'){ state.view='marketplace'; if(state.mktTab==='bookmarks') state.mktTab='home'; }
      else if(v==='bookmarks'){ state.view='marketplace'; state.mktTab='bookmarks'; }
      else state.view=v;
      render();
    };
    if(extra==='+new'){
      const nb=el('button','np-new',`${icon('plus',12,2.4)} New`);
      nb.title='Create a data product';
      nb.onclick=e=>{ e.stopPropagation(); state.view='myproducts'; render(); setTimeout(openCreateModal,0); };
      b.appendChild(nb);
    }
    menu.appendChild(b);
  });
}

/* ---- Card ---- */
function card(p){
  const c=el('div','pcard');
  const src=SRC[p.src];
  const isEDM=state.section==='edm';
  const originSeg=SECTIONS[p.seg];
  const originHTML = isEDM
    ? `<span class="origin" style="color:${originSeg.color};background:${originSeg.bg}">${icon('arrowUp',12,2)} From ${originSeg.short}</span>`
    : '';
  const [scls,slbl]=sensOf(p);
  c.innerHTML=`
    <button class="bm ${p.bm?'on':''}" title="Bookmark">${icon('bookmark',18)}</button>
    <div class="p-icon" style="background:${p.ic}">${icon(productIcon(p),23,1.7)}</div>
    <h4>${p.name}</h4>
    <div class="p-owner"><span class="oav">${initials(p.owner)}</span>${p.owner}</div>
    <div class="p-source"><span class="p-src" style="color:${src.c}">${icon(src.icon,16)}</span>${src.n}<span class="sens ${scls}" style="margin-left:auto">${slbl}</span></div>
    ${originHTML}
    <p class="p-desc">${p.desc}</p>
    <div class="p-stats">
      <span title="Fields">${icon('columns',15)} ${p.fields}</span>
      <span title="Tables">${icon('rows',15)} ${p.tables}</span>
      <span title="Lineage">${icon('lineage',15)} ${p.lin}</span>
    </div>
    <div class="p-pills">${productDomains(p).map(d=>`<span class="pill">${d}</span>`).join('')}</div>
  `;
  // bookmark toggle
  c.querySelector('.bm').onclick=()=>{
    p.bm=!p.bm; persist();
    toast(p.bm?`Bookmarked “${p.name}”`:`Removed “${p.name}” from bookmarks`);
    render();
  };
  // segment footer: push-to-EDM flow (with enterprise-domain mapping)
  if(!isEDM){
    const f=el('div','p-footer');
    if(p.edm){
      const chips=(p.edmDomains||[]).map(d=>`<span class="pill edm-pill">${d}</span>`).join('');
      f.innerHTML=`<div class="pushed-row"><span class="pushed-tag">${icon('check',13,2.2)} In EDM</span>${chips}</div>`;
      const acts=el('div','push-acts');
      const edit=el('button','link-btn','Edit domains'); edit.onclick=()=>openPushModal(p);
      const undo=el('button','link-btn','Remove'); undo.onclick=()=>{p.edm=false;persist();toast(`Removed “${p.name}” from the EDM`);render();};
      acts.appendChild(edit); acts.appendChild(undo); f.appendChild(acts);
    }else{
      const btn=el('button','push-btn',`${icon('arrowUp',15,2)} Push to EDM`); btn.onclick=()=>openPushModal(p);
      f.appendChild(btn);
    }
    c.appendChild(f);
  }
  return c;
}

/* ---- Push-to-EDM dialog: choose which ENTERPRISE domain(s) to publish into ---- */
function openPushModal(p){
  const isEdit=!!p.edm;
  const seg=SECTIONS[p.seg];
  const selected=new Set(p.edmDomains&&p.edmDomains.length?p.edmDomains:suggestEdmDomains(p));
  const ov=el('div','modal-overlay');
  ov.innerHTML=`<div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <div><div class="modal-kicker">${isEdit?'Edit enterprise domains':'Publish to the Enterprise Data Marketplace'}</div>
        <h3>${escapeHtml(p.name)}</h3></div>
      <button class="hp-icon-btn mclose" title="Close">${icon('x',15)}</button>
    </div>
    <div class="modal-body">
      <div class="mnote"><span style="display:inline-flex;vertical-align:-.2em;margin-right:5px">${icon('landmark',15)}</span>Enterprise domains are curated separately from <b>${seg.short}</b> domains. Choose where this product should appear in the top-level EDM.</div>
      <div class="mfield"><span class="mlbl">Its ${seg.short} domains</span>
        <div class="mchips">${p.domains.map(d=>`<span class="pill">${d}</span>`).join('')}</div></div>
      <div class="mfield"><span class="mlbl">Publish into enterprise domain(s)</span>
        <div class="dpick" id="dpick"></div></div>
    </div>
    <div class="modal-foot">
      <button class="mcancel">Cancel</button>
      <button class="mok">${isEdit?'Save changes':icon('arrowUp',15,2)+' Publish to EDM'}</button>
    </div></div>`;
  document.body.appendChild(ov);
  const pick=ov.querySelector('#dpick'), ok=ov.querySelector('.mok');
  const renderPick=()=>{
    pick.innerHTML='';
    EDM_DOMAINS.forEach(d=>{
      const [ic,color]=domainMeta(d); const on=selected.has(d);
      const b=el('button','dpick-item'+(on?' on':''));
      b.innerHTML=`<span class="di" style="background:${color}">${icon(ic,17)}</span><span class="dl">${d}</span><span class="dck">${on?icon('check',15,2.4):''}</span>`;
      b.onclick=()=>{ on?selected.delete(d):selected.add(d); renderPick(); ok.disabled=!selected.size; };
      pick.appendChild(b);
    });
    ok.disabled=!selected.size;
  };
  renderPick();
  const close=()=>{ ov.remove(); document.removeEventListener('keydown',esc); };
  const esc=e=>{ if(e.key==='Escape') close(); };
  document.addEventListener('keydown',esc);
  ov.querySelector('.mclose').onclick=close;
  ov.querySelector('.mcancel').onclick=close;
  ov.onclick=e=>{ if(e.target===ov) close(); };
  ok.onclick=()=>{
    if(!selected.size) return;
    const wasEdit=isEdit; p.edm=true; p.edmDomains=[...selected]; persist();
    toast(`“${p.name}” ${wasEdit?'updated':'published to EDM'} · ${[...selected].join(', ')}`);
    close(); render();
  };
  requestAnimationFrame(()=>ov.classList.add('open'));
}

/* ---- Filtering / sorting ---- */
function visible(){
  let list=productsFor(state.section);
  if(state.q){const q=state.q.toLowerCase();
    list=list.filter(p=>(p.name+' '+p.desc+' '+p.owner+' '+p.domains.join(' ')).toLowerCase().includes(q));}
  if(state.filter!=='all') list=list.filter(p=>productDomains(p).includes(state.filter));
  if(state.sort==='name') list=[...list].sort((a,b)=>a.name.localeCompare(b.name));
  if(state.sort==='popular') list=[...list].sort((a,b)=>b.pop-a.pop);
  return list;
}
function allDomains(){
  const s=new Set(); productsFor(state.section).forEach(p=>productDomains(p).forEach(d=>s.add(d)));
  return [...s].sort();
}

/* shared grid filler */
function fillGrid(wrap){
  wrap.innerHTML='';
  const list=visible();
  if(!list.length){
    wrap.appendChild(el('div','empty',
      `<div class="eicon">${icon('search',34,1.5)}</div><h4>No matching data products</h4><p>Try a different search term or filter.</p>`));
    return;
  }
  const grid=el('div','grid');
  list.forEach(p=>grid.appendChild(card(p)));
  wrap.appendChild(grid);
}

/* ---- Bookmarks tab (within The Marketplace) ---- */
function renderBookmarks(root){
  const list=productsFor(state.section).filter(p=>p.bm);
  const head=el('div','page-head');
  head.innerHTML=`<p class="page-sub" style="margin-top:8px">${list.length} saved data product${list.length===1?'':'s'} in ${SECTIONS[state.section].name}.</p>`;
  root.appendChild(head);
  if(!list.length){
    const e=el('div','empty',
      `<div class="eicon">${icon('bookmark',34,1.5)}</div><h4>No bookmarked products</h4><p>Products you bookmark will appear here</p>`);
    const b=el('button','btn-outline','Browse data products');
    b.onclick=()=>{state.mktTab='browse';render();};
    e.appendChild(b); root.appendChild(e); return;
  }
  const grid=el('div','grid');
  list.forEach(p=>grid.appendChild(card(p)));
  root.appendChild(grid);
}

  Ticketing:['tag','#7A2E6B'], Parks:['landmark','#0E9488'], 'Guest Experience':['sparkles','#DE8138'],

};
const domainMeta=d=>DOMAIN_META[d]||EDM_DOMAIN_META[d]||['tag','#6A7787'];
function sensOf(p){
  if(p.domains.some(d=>['Risk','Security','Fraud','Compliance','Payments'].includes(d))) return ['restricted','Restricted'];
  if(p.domains.some(d=>['Finance','People','HR','Customer','Legal','Loyalty'].includes(d))) return ['internal','Internal'];
  return ['public','Public'];
}

  const sec=SECTIONS[state.section];

  const doms=allDomains();
  const c=czView();                 // merged content + appearance + visibility
  const show=c.show;
  const home=el('div','home');
  const E=escapeHtml;

  /* 1 — HERO: logo + title over background (customizable) */
  const hero=el('div','hp-hero'+(c.heroAlign==='center'?' center':'')); hero.id='hpHero'; hero.setAttribute('style',bgStyleFor(c));
  hero.innerHTML=`
    <div class="hp-logo" id="hpLogo">${logoInner(c)}</div>
    <div class="hp-hero-inner">
      <div class="hp-eyebrow">${E(c.eyebrow)}</div>
      <h1 class="hp-title">${E(c.title)}</h1>
      <p class="hp-tagline">${E(c.tagline)}</p>
    </div>`;
  home.appendChild(hero);

  /* go to the Browse view (optionally with a query/domain filter) */
  const goBrowse=opts=>{ if(opts&&'q' in opts)state.q=opts.q; if(opts&&'filter' in opts)state.filter=opts.filter; state.view='marketplace'; state.mktTab='browse'; render(); };

  /* 2 — SEARCH BAR (size + text customizable) → routes to Browse */
  const sz=c.searchSize||'md';
  const sw=el('div','hp-search-wrap sz-'+sz); sw.id='hpSearchWrap';
  sw.innerHTML=`<div class="hp-search sz-${sz}"><span class="mg">${icon('search',18)}</span>
    <input placeholder="${E(c.searchPlaceholder)}"/>
    <button class="go">${E(c.searchBtn)}</button></div>`;
  const heroInput=sw.querySelector('input'); heroInput.value=state.q;
  const goSearch=()=>{ goBrowse({q:heroInput.value.trim()}); };
  sw.querySelector('.go').onclick=goSearch;
  heroInput.addEventListener('keydown',e=>{if(e.key==='Enter')goSearch();});
  home.appendChild(sw);

  /* 3 — WELCOME MESSAGE */
  if(show.welcome){
    const w=el('div','welcome');
    w.innerHTML=`<div class="wemoji">${icon('sparkles',20)}</div>
      <div><h4>${E(c.welcomeTitle)}</h4><p>${E(c.welcomeBody)}</p></div>
      <div class="wtools">
        <button class="hp-icon-btn" id="wHide" title="Hide message">${icon('x',15)}</button>
      </div>`;
    w.querySelector('#wHide').onclick=()=>{czSetShow('welcome',false);render();};
    home.appendChild(w);
  }

  /* 4 — DOMAINS grid (click opens Browse filtered by that domain) */
  if(show.domains){
    const dsec=el('div','hp-sec panel');
    dsec.innerHTML=`<div class="hp-sec-head"><div><h3>${E(c.domainsTitle)}</h3><p>${E(c.domainsSub)} · ${doms.length} domain${doms.length===1?'':'s'}</p></div></div>`;
    const dgrid=el('div','domain-grid'); dgrid.id='domGrid';
    doms.forEach(d=>{
      const [ic,color]=domainMeta(d);
      const cnt=mine.filter(p=>productDomains(p).includes(d)).length;
      const t=el('button','domain-tile');
      t.innerHTML=`<span class="dic" style="background:${color}">${icon(ic,18)}</span>
        <span><span class="dn">${d}</span><span class="dc">${cnt} product${cnt!==1?'s':''}</span></span>`;
      t.onclick=()=>goBrowse({filter:d,q:''});
      dgrid.appendChild(t);
    });
    dsec.appendChild(dgrid);
    dsec.appendChild(el('div','dom-toggle-wrap'));
    home.appendChild(dsec);
  }

  /* 5 — RECENTLY USED DATA PRODUCTS */
  if(show.recent){
    const rsec=el('div','hp-sec panel');
    rsec.innerHTML=`<div class="hp-sec-head"><div><h3>${E(c.recentTitle)}</h3><p>${E(c.recentSub)}</p></div></div>`;
    const rrow=el('div','recent-row');
    const recents=[...mine].sort((a,b)=>b.pop-a.pop).slice(1,6);
    const whens=['2h ago','Yesterday','2 days ago','Last week','Last week'];
    recents.forEach((p,i)=>{
      const [scls,slbl]=sensOf(p);
      const cd=el('div','recent-card');
      cd.innerHTML=`<div class="rtop"><span class="ric" style="background:${p.ic}">${icon(productIcon(p),18)}</span>
        <div><h5>${p.name}</h5><div class="rmeta">${(productDomains(p)[0]||p.domains[0])} · ${SRC[p.src].n}</div></div></div>
        <div style="display:flex;align-items:center;justify-content:space-between">
          <span class="sens ${scls}">${slbl}</span><span class="rwhen">${icon('clock',13)} ${whens[i]||'Recently'}</span></div>`;
      rrow.appendChild(cd);
    });
    if(!recents.length) rrow.innerHTML='<p style="color:var(--muted);font-size:13px;padding:8px 2px">No recent activity yet.</p>';
    rsec.appendChild(rrow); home.appendChild(rsec);
  }

  /* 6 — MOST POPULAR (teaser — 3 cards, links to the Browse page) */
  if(show.popular){
    const psec=el('div','hp-sec panel');
    psec.innerHTML=`<div class="hp-sec-head"><div><h3>${E(c.popularTitle)}</h3><p>${E(c.popularSub)}</p></div>
      <div class="hp-sec-tools"><button class="hp-seeall" id="popAll">See all →</button></div></div>`;
    const grid=el('div','grid');
    [...mine].sort((a,b)=>b.pop-a.pop).slice(0,3).forEach(p=>grid.appendChild(card(p)));
    if(!mine.length) grid.appendChild(el('div','empty',`<div class="eicon">${icon('box',34,1.5)}</div><h4>No data products yet</h4><p></p>`));
    psec.appendChild(grid); home.appendChild(psec);
    psec.querySelector('#popAll').onclick=()=>goBrowse({filter:'all',q:''});
  }

  /* 7 — OTHER CUSTOMIZABLE SECTIONS */
  if(show.custom){
    const csec=el('div','hp-sec');
    csec.innerHTML=`<div class="hp-sec-head"><div><h3>${E(c.customTitle)}</h3><p>${E(c.customSub)}</p></div></div>
      <div class="custom-block"><div class="cbig">${icon('plus',26,1.8)}</div><h4>${E(c.customCardTitle)}</h4>
        <p>${E(c.customCardBody)}</p>
        <button class="addbtn">${E(c.customCardBtn)}</button></div>`;
    home.appendChild(csec);
  }

  /* 8 — ACCESS MANAGER APP LINK */
  if(show.access){
    const ab=el('div','access-bar');
    ab.innerHTML=`<div class="aic">${icon('key',20)}</div>
      <div class="atxt"><b>${E(c.accessTitle)}</b><span>${E(c.accessBody)}</span></div>
      <button class="abtn">${E(c.accessBtn)}</button>`;
    home.appendChild(ab);
  }

  root.appendChild(home);

  /* clip the Domains grid to N rows (default 2), with a Show all / Show less toggle.
     Deferred to the next frame so the grid has its final laid-out width when measured. */
  if(show.domains){
    const doClip=()=>{
      const dgrid=home.querySelector('#domGrid'), togWrap=home.querySelector('.dom-toggle-wrap');
      if(!dgrid || !togWrap || !dgrid.isConnected) return;
      const count=(typeof c.domainCount==='number' && c.domainCount>0)?c.domainCount:null; // explicit number, else 2 rows
      const tiles=[...dgrid.children];
      tiles.forEach(t=>t.style.display='');
      togWrap.innerHTML='';
      if(!state.domainsExpanded && tiles.length){
        let showN;
        if(count!=null){ showN=count; }
        else { const gap=12,min=148,w=dgrid.clientWidth||900; showN=Math.max(1,Math.floor((w+gap)/(min+gap)))*2; } // default: 2 rows
        let hidden=0;
        tiles.forEach((t,i)=>{ if(i>=showN){ t.style.display='none'; hidden++; } });
        if(hidden>0){
          const b=el('button','dom-toggle',`Show all ${tiles.length} domains ${icon('chevronDown',15,2)}`);
          b.onclick=()=>{ const sc=document.getElementById('content').scrollTop; state.domainsExpanded=true; render(); document.getElementById('content').scrollTop=sc; };
          togWrap.appendChild(b);
        }
      } else if(state.domainsExpanded){
        const b=el('button','dom-toggle',`Show less ${icon('chevronUp',15,2)}`);
        b.onclick=()=>{ const sc=document.getElementById('content').scrollTop; state.domainsExpanded=false; render(); document.getElementById('content').scrollTop=sc; };
        togWrap.appendChild(b);
      }
    };
    requestAnimationFrame(doClip);
  }
}

/* ---- View: Browse — AI insights hero + product catalog (matches reference) ---- */
function renderBrowse(root){
  const c=czView(); const doms=allDomains(); const E=escapeHtml; const sec=SECTIONS[state.section];

  /* AI insights hero */
  const hero=el('div','ai-hero');
  hero.innerHTML=`
    <div class="ai-eyebrow">Get insights from <a href="#" onclick="return false">${E(sec.name)}</a></div>
    <h2 class="ai-h">How can I help you today?</h2>
    <div class="ai-box"><input id="bSearch" placeholder="Describe your use case, e.g. Churn rate by customer age"/>
      <button class="send" id="bAsk" title="Search data products">${icon('arrowUp',18,2.2)}</button></div>
    <div class="ai-disc">${icon('sparkles',15)} AI generated content. Mistakes may be present.</div>`;
  root.appendChild(hero);

  /* Browse Data Products */
  const sh=el('div','section-head');
  sh.innerHTML=`<h3>${E(c.browseTitle)}</h3><p>${E(c.browseSub)}</p>`;
  root.appendChild(sh);

  const tools=el('div','browse-tools');
  tools.innerHTML=`
    <label class="control">Sort:
      <select id="bSort"><option value="unsorted">Unsorted</option><option value="popular">Most popular</option><option value="name">Name (A–Z)</option></select></label>
    <label class="control">Filter:
      <select id="bFilter"><option value="all">All domains</option>${doms.map(d=>`<option value="${d}">${d}</option>`).join('')}</select></label>
    <span class="browse-count" id="bCount"></span>`;
  root.appendChild(tools);
  const gridWrap=el('div'); root.appendChild(gridWrap);

  const sortSel=tools.querySelector('#bSort'), filSel=tools.querySelector('#bFilter');
  const srch=hero.querySelector('#bSearch');
  sortSel.value=state.sort; filSel.value=state.filter; srch.value=state.q;
  const refill=()=>{ fillGrid(gridWrap); const n=visible().length; tools.querySelector('#bCount').textContent=`${n} data product${n===1?'':'s'}`; };
  sortSel.onchange=e=>{state.sort=e.target.value;refill();};
  filSel.onchange=e=>{state.filter=e.target.value;refill();};
  srch.oninput=e=>{state.q=e.target.value;refill();};
  hero.querySelector('#bAsk').onclick=()=>{state.q=srch.value;refill();srch.focus();};
  srch.addEventListener('keydown',e=>{if(e.key==='Enter'){state.q=srch.value;refill();}});
  refill();
}

/* ---- View: My Data Products (author & manage your own; not at EDM) ---- */
function renderMyProducts(root){
  const sec=SECTIONS[state.section];
  const head=el('div','page-head mine-head');
  head.innerHTML=`<div><h1 class="page-title">My Data Products</h1><p class="page-sub">Products you own in ${sec.name}. Publish them to the Enterprise Data Marketplace to share company-wide.</p></div>`;
  const nb=el('button','btn-primary',`${icon('plus',15,2.2)} New data product`);
  nb.onclick=openCreateModal;
  head.appendChild(nb);
  root.appendChild(head);

  const mine=state.products.filter(p=>p.seg===state.section);
  if(!mine.length){
    root.appendChild(el('div','empty',`<div class="eicon">${icon('box',34,1.5)}</div><h4>No data products yet</h4><p>Create your first data product to get started.</p>`));
    return;
  }
  const grid=el('div','grid'); mine.forEach(p=>grid.appendChild(card(p))); root.appendChild(grid);
}

/* ---- View: Manage Authentication (prototype settings) ---- */
function renderAuth(root){
  const sec=SECTIONS[state.section];
  const head=el('div','page-head');
  head.innerHTML=`<h1 class="page-title">Manage Authentication</h1><p class="page-sub">Control how users and services connect to ${sec.name}.</p>`;
  root.appendChild(head);
  const rows=[
    ['shield','Single Sign-On (SSO)','SAML / OIDC for workforce access','Enabled'],
    ['key','API Tokens','Personal & service-account tokens for programmatic access','3 active'],
    ['database','Source Connections','Credentials for the connected data sources','Managed'],
    ['users','Access Requests','Approvals for data product access','2 pending'],
  ];
  const list=el('div','cur-list');
  rows.forEach(([ic,t,d,badge])=>{
    const r=el('div','cur-row');
    r.innerHTML=`<div class="cur-ic" style="background:#0E1F33">${icon(ic,20)}</div>
      <div class="cur-main"><h4>${t}</h4><div class="cm">${d}</div></div>
      <span class="cur-status in" style="color:var(--blue);background:var(--edm-bg)">${badge}</span>
      <div class="cur-acts"><button class="link-btn">Configure</button></div>`;
    list.appendChild(r);
  });
  root.appendChild(list);
  root.appendChild(el('div','wf-note',`<span style="display:inline-flex;vertical-align:-.2em">${icon('key',15)}</span><span><b>Prototype.</b> Authentication settings are placeholders for the design review.</span>`));
}

/* ---- Create data product dialog (segments only) ---- */
function openCreateModal(){
  if(state.section==='edm') return;
  const seg=SECTIONS[state.section];
  const doms=[...new Set(state.products.filter(p=>p.seg===state.section).flatMap(p=>p.domains))].sort();
  const chosen=new Set();
  const ov=el('div','modal-overlay');
  ov.innerHTML=`<div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <div><div class="modal-kicker">${seg.short} · New data product</div><h3>Create a data product</h3></div>
      <button class="hp-icon-btn mclose" title="Close">${icon('x',15)}</button>
    </div>
    <div class="modal-body">
      <div class="cz-field"><label>Name</label><input id="npName" placeholder="e.g. Guest Loyalty 360"/></div>
      <div class="cz-field"><label>Owner</label><input id="npOwner" value="Chetan Tewari"/></div>
      <div class="cz-field"><label>Source</label><select id="npSrc">${Object.keys(SRC).map(s=>`<option value="${s}">${SRC[s].n}</option>`).join('')}</select></div>
      <div class="cz-field"><label>Short description</label><textarea id="npDesc" rows="2" placeholder="What does this data product provide?"></textarea></div>
      <div class="mfield"><span class="mlbl">Domains</span><div class="dpick" id="npDoms"></div></div>
    </div>
    <div class="modal-foot">
      <button class="mcancel">Cancel</button>
      <button class="mok">${icon('plus',15,2.2)} Create</button>
    </div></div>`;
  document.body.appendChild(ov);
  const pick=ov.querySelector('#npDoms');
  const renderDoms=()=>{ pick.innerHTML='';
    (doms.length?doms:['Product']).forEach(d=>{
      const [ic,color]=domainMeta(d); const on=chosen.has(d);
      const b=el('button','dpick-item'+(on?' on':''));
      b.innerHTML=`<span class="di" style="background:${color}">${icon(ic,17)}</span><span class="dl">${d}</span><span class="dck">${on?icon('check',15,2.4):''}</span>`;
      b.onclick=()=>{ on?chosen.delete(d):chosen.add(d); renderDoms(); };
      pick.appendChild(b);
    });
  };
  renderDoms();
  const close=()=>{ ov.remove(); document.removeEventListener('keydown',esc); };
  const esc=e=>{ if(e.key==='Escape') close(); };
  document.addEventListener('keydown',esc);
  ov.querySelector('.mclose').onclick=close;
  ov.querySelector('.mcancel').onclick=close;
  ov.onclick=e=>{ if(e.target===ov) close(); };
  ov.querySelector('.mok').onclick=()=>{
    const name=ov.querySelector('#npName').value.trim();
    if(!name){ ov.querySelector('#npName').focus(); return; }
    const colors=['#2563EB','#6D5AE6','#0E9488','#DE8138','#B4468A','#2C6FBB','#C0392B'];
    const p={ id:'new'+Date.now(), seg:state.section, edm:false, name,
      owner:ov.querySelector('#npOwner').value.trim()||'You', src:ov.querySelector('#npSrc').value,
      ic:colors[state.products.length%colors.length], desc:ov.querySelector('#npDesc').value.trim()||'Newly created data product.',
      fields:12, tables:2, lin:3, pop:1, domains:[...chosen].length?[...chosen]:[doms[0]||'Product'], created:true, edmDomains:[] };
    state.products.push(p); persist(); persistNew();
    toast(`Created “${name}” in ${seg.short}`); close(); state.view='myproducts'; render();
  };
  requestAnimationFrame(()=>ov.classList.add('open'));
}

/* ---- View: Manage (customization + data-product curation) ---- */
function renderManage(root){
  const sec=SECTIONS[state.section];
  const tab=state.manageTab||'design';
  const head=el('div','mgr-head');
  head.innerHTML=`<h1 class="page-title">Manage</h1><p class="page-sub">${sec.name}</p>`;
  const tabs=el('div','mgr-tabs');
  [['design','sliders','Home page design'],['products','database','Data products']].forEach(([k,ic,l])=>{
    const b=el('button','mgr-tab'+(tab===k?' active':''),`${icon(ic,15)} ${l}`);
    b.onclick=()=>{state.manageTab=k;render();};
    tabs.appendChild(b);
  });
  head.appendChild(tabs);
  root.appendChild(head);

  if(tab==='products') return renderCuration(root);

  const split=el('div','mgr-split');
  const controls=el('div','mgr-controls'); controls.id='mgrControls';
  const pv=el('div','mgr-preview');
  pv.innerHTML=`<div class="mgr-pv-label">Live preview · Home page</div>
    <div class="mgr-pv-frame"><div class="mgr-pv-inner" id="mgrPv"></div></div>`;
  split.appendChild(controls); split.appendChild(pv);
  root.appendChild(split);
  buildControls(controls);
  czPreview();
}

/* Manage → Data products: curation + push-to-EDM management */
function renderCuration(root){
  const isEDM=state.section==='edm';
  const list=productsFor(state.section);
  const note=el('div','cur-note');
  note.innerHTML=isEDM
    ? `<span>${icon('landmark',16)}</span><span>These products were published from a segment and pushed up to the EDM. Edit their enterprise domains or remove them from the EDM.</span>`
    : `<span>${icon('arrowUp',16,2)}</span><span>Publish products from this segment up to the Enterprise Data Marketplace, and choose which enterprise domain(s) they appear under.</span>`;
  root.appendChild(note);

  const wrap=el('div','cur-list');
  list.forEach(p=>{
    const row=el('div','cur-row');
    const inEdm=p.edm;
    const domChips=(isEDM?(p.edmDomains||[]):(p.edmDomains||[])).map(d=>`<span class="pill edm-pill">${d}</span>`).join('');
    row.innerHTML=`
      <div class="cur-ic" style="background:${p.ic}">${icon(productIcon(p),20)}</div>
      <div class="cur-main"><h4>${p.name}</h4><div class="cm">${p.owner} · ${SRC[p.src].n}${isEDM?` · From ${SECTIONS[p.seg].short}`:''}</div></div>
      <div class="cur-doms">${p.domains.map(d=>`<span class="pill">${d}</span>`).join('')}</div>
      <span class="cur-status ${inEdm?'in':'out'}">${inEdm?icon('check',13,2.2)+' In EDM':'Not in EDM'}</span>
      <div class="cur-doms">${domChips}</div>
      <div class="cur-acts"></div>`;
    const acts=row.querySelector('.cur-acts');
    if(inEdm){
      const edit=el('button','link-btn','Edit domains'); edit.onclick=()=>openPushModal(p);
      const rm=el('button','link-btn','Remove'); rm.onclick=()=>{p.edm=false;persist();toast(`Removed “${p.name}” from the EDM`);render();};
      acts.appendChild(edit); if(!isEDM) acts.appendChild(rm); else acts.appendChild(rm);
    }else{
      const push=el('button','push-btn','▲ Push to EDM'); push.onclick=()=>openPushModal(p);
      acts.appendChild(push);
    }
    wrap.appendChild(row);
  });
  root.appendChild(wrap);
}

/* ---- Master render ---- */
function render(){
  document.querySelector('.app').classList.toggle('nav-open', !!state.navOpen);
  renderRail(); renderNavPanel();
  // My Data Products isn't available at the top-level EDM
  if(state.view==='myproducts' && state.section==='edm') state.view='marketplace';
  const root=document.getElementById('content'); root.innerHTML='';
  if(state.view==='auth') renderAuth(root);
  else if(state.view==='myproducts') renderMyProducts(root);
  else if(state.view==='manage') renderManage(root);
  else renderMarketplacePage(root);
}

/* ---- The Marketplace page: Home / Browse / Bookmarks content tabs ---- */
function renderMarketplacePage(root){
  const tab=state.mktTab||'home';
  const strip=el('div','mkt-tabs');
  [['home','Home'],['browse','Browse'],['bookmarks','Bookmarks']].forEach(([k,l])=>{
    const t=el('button','mkt-tab'+(tab===k?' active':''),l);
    t.onclick=()=>{ state.mktTab=k; render(); };
    strip.appendChild(t);
  });
  root.appendChild(strip);
  if(tab==='browse') renderBrowse(root);
  else if(tab==='bookmarks') renderBookmarks(root);
  else renderHome(root);
}

/* ---- File-upload wiring (used by Manage → Home page design) ---- */
document.getElementById('czLogoFile').onchange=e=>{const f=e.target.files[0];if(!f)return;fileToDataURL(f,600,240,url=>{czSet('logoImg',url);czRefresh();toast('Logo updated');});e.target.value='';};
document.getElementById('czBgFile').onchange=e=>{const f=e.target.files[0];if(!f)return;fileToDataURL(f,1600,900,url=>{czSet('bgImg',url);czSet('bg','custom');czRefresh();toast('Background updated');});e.target.value='';};

document.getElementById('tbSearch').innerHTML=icon('search',16);
document.getElementById('tbHelp').innerHTML=icon('help',16);

render();
</script>
